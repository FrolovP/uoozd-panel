# Образец конфигурации панели УООЗД.
# Скопируйте в config.ini и заполните. Файл config.ini НЕ коммитить (см. .gitignore).

[storage]
backend = mysql            ; files — файловый режим (Excel/JSON), mysql — хранилище в MySQL

[mysql]
host = 127.0.0.1
port = 3306
database = uoozd
user = uoozd_app
; Пароль НЕ здесь: переменная окружения UOOZD_DB_PASSWORD или хранилище учётных данных ОС.
; ssl_ca = C:\certs\ca.pem ; включить, когда БД на отдельном сервере (TLS)
pool_size = 8

[panel]
port = 8090
login_required = true      ; боевой режим: вход по логину и паролю обязателен
